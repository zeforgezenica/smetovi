name: Praćenje vijesti o Smetovima

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Preuzmi repozitorij
        uses: actions/checkout@v5

      - name: Postavi Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Provjeri RSS kanale
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/check-news-feeds.mjs
